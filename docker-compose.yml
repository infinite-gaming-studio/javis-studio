services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    ports:
      - "18000:8000"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
      - ./.env:/app/.env
      - audio_cache:/tmp/javis_audio_cache
    environment:
      - STORAGE_DIR=/app/storage
      - FRONTEND_URL=http://frontend:3000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "13000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:18000
      - BACKEND_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  audio_cache:
