version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    ports:
      - "18000:8000"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
      - ./.env:/app/.env
    environment:
      - STORAGE_DIR=/app/storage

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "13000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:18000
      - BACKEND_API_URL=http://backend:8000
    command: >
      sh -c "npm install && npm run dev"
    depends_on:
      - backend
